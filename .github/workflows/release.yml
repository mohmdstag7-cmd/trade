name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Build with PyInstaller (one-folder)
        run: pyinstaller installer/app.spec --noconfirm --clean

      - name: Self-check the built exe (imports MetaTrader5)
        run: |
          dist\MT5TradingWorkstation\MT5TradingWorkstation.exe --self-check

      - name: Build the update manifest (Phase 6 delta updates)
        run: |
          python tools\build_manifest.py dist\MT5TradingWorkstation --version $env:GITHUB_REF_NAME.TrimStart("v")

      - name: Copy the manifest out as a release asset
        run: |
          Copy-Item dist\MT5TradingWorkstation\manifest.json manifest.json

      - name: Zip portable build
        run: |
          Compress-Archive -Path dist\MT5TradingWorkstation -DestinationPath MT5TradingWorkstation-portable.zip

      - name: Build the delta package against the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          # gh release view (no args) returns the NEWEST release, which in
          # the release-please flow IS the current tag - so the guard below
          # always skipped and deltas were never built. List releases and
          # pick the newest whose tag differs from the current one.
          $prevTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" --jq "[.[].tag_name] | map(select(. != "v$version")) | .[0] // """ 2>$null
          if (-not $prevTag) {
            Write-Host "No previous release tag found - skipping delta package."
            exit 0
          }
          $prevVersion = $prevTag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path prev_download | Out-Null
          gh release download $prevTag --repo $env:GITHUB_REPOSITORY `
            --pattern "MT5TradingWorkstation-portable.zip" --dir prev_download
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Previous portable zip unavailable — skipping delta package."
            exit 0
          }
          Expand-Archive -Path prev_download\MT5TradingWorkstation-portable.zip -DestinationPath prev_extract
          python tools\build_delta.py `
            --prev-dir prev_extract\MT5TradingWorkstation `
            --new-dir dist\MT5TradingWorkstation `
            --from-version $prevVersion --to-version $version `
            --out "delta-v$prevVersion-to-v$version.zip"
          if ($LASTEXITCODE -eq 3) {
            Write-Host "No file differences — no delta needed."
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup (version pinned for reproducible builds)
        run: choco install innosetup --version 6.4.1 -y --no-progress

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\innosetup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\installer\MT5TradingWorkstation-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe",
            "MT5TradingWorkstation-portable.zip",
            "manifest.json"
          )
          $deltas = Get-ChildItem -Path . -Filter "delta-v*.zip" -ErrorAction SilentlyContinue
          foreach ($delta in $deltas) { $files += $delta.Name }
          $hashLines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash
            "$hash  $(Split-Path -Leaf $file)"
          }
          $hashLines | Set-Content -Encoding utf8 checksums.txt
          Get-Content checksums.txt

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/MT5TradingWorkstation-Setup-*.exe
            MT5TradingWorkstation-portable.zip
            manifest.json
            delta-v*.zip
            checksums.txt
          generate_release_notes: true
