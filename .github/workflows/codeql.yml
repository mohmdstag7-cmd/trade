name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a3267 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95c # v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95c # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95c # v3
        with:
          category: "/language:python"
