name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1f # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN-created events do NOT trigger other workflows (GitHub
          # suppresses them), so release.yml (tag push) never ran. Use a PAT or
          # GitHub App token stored as RELEASE_PLEASE_TOKEN; falls back to
          # GITHUB_TOKEN for forks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
