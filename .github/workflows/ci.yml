name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: lint & test (windows, py3.11)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a3267 # v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951 # v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install -e ".[dev]" --retries 5 --timeout 60

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy app

      - name: Pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6 # v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
