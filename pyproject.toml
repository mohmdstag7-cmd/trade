[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-workstation"
version = "0.4.0"
description = "MT5 Trading Workstation: market analysis, calibrated win probability, risk-controlled execution on MetaTrader 5."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "mohmdstag7-cmd" }]
keywords = ["metatrader5", "trading", "fx", "desktop", "pyqt", "pyside"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: 10",
    "Operating System :: Microsoft :: Windows :: 11",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "MetaTrader5==5.0.6180 ; sys_platform == 'win32'",
    "PySide6==6.11.2",
    "pandas==3.0.6",
    "numpy==2.4.2",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "shap==0.48.0",
    "joblib==1.6.0",
    "supabase==2.31.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "keyring==25.7.0",
    "loguru==0.7.3",
    "psutil==7.2.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pyinstaller==6.22.3",
]

[project.scripts]
mt5-workstation = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "installer/build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Persian UI strings intentionally contain Arabic-script letters (RUF001 flags
# them as "ambiguous" versus look-alike Latin letters).
"app/ui/i18n/strings.py" = ["RUF001"]
# Friendly Persian messages in the MT5 error taxonomy share the same property.
"app/mt5/errors.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "MetaTrader5",
    "shap.*",
    "lightgbm",
    "supabase.*",
    "keyring.*",
    "pytestqt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
qt_api = "pyside6"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pytest_cov.*",
]
